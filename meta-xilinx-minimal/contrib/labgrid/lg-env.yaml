targets:
  main:
    resources:
      USBSerialPort:
        match:
          ID_SERIAL_SHORT: '37158'
          ID_USB_INTERFACE_NUM: '01'
      NetworkPowerPort:
        model: 'digitalloggers_http'
        host: 'http://admin:switch@192.168.11.14'
        index: '1'
      USBSDMuxDevice:
        match:
          ID_SERIAL_SHORT: '00048.00785'
    drivers:
      SerialDriver: {}
      UBootDriver:
        prompt: "ZynqMP>"
      NetworkPowerDriver:
        delay: 5.0
      USBStorageDriver: {}
      USBSDMuxDriver: {}
      ShellDriver:
        prompt: 'root@[\w\-]+:[^ ]+ '
        login_prompt: ' login:'
        username: 'root'
        login_timeout: 100
      ZCU104Strategy: {}
#      UBootStrategy: {}
images:
  sd_image: images/image.wic.qemu-sd

imports:
 - myStrategy.py

